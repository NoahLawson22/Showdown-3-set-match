<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ScoreDown</title>
<style>
  :root{
    --bg: #000000;
    --panel: #111214;
    --divider: #2a2c30;
    --text: #FFFFFF;
    --p1: #39E0FF;
    --p2: #FF4D6D;
    --goal: #2FE875;
    --foul: #FFA733;
    --warn: #FFD54A;
    --penalty: #FF3B3B;
    --amber: #FFC94A;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    margin:0;
    padding:0;
    height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    overflow: hidden;
  }

  .page{
    display:flex;
    flex-direction:column;
    height:100dvh;
    width:100vw;
  }
  .page[hidden]{
    display:none;
  }

  /* ---------- LANDING PAGE ---------- */
  .app-header{
    flex: 0 0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 14px 12px;
    gap: 4px;
    background: var(--panel);
  }
  .app-title{
    font-weight: 900;
    letter-spacing: 0.03em;
    color: var(--amber);
    font-size: clamp(24px, 6vh, 48px);
    outline: none;
  }
  .app-title:focus-visible{
    outline: 3px solid var(--amber);
    outline-offset: 4px;
  }
  .app-description{
    font-weight: 500;
    color: var(--text);
    font-size: clamp(12px, 2.6vh, 18px);
    opacity: 0.85;
  }
  .app-tip{
    font-weight: 500;
    color: var(--text);
    font-size: clamp(10px, 2.1vh, 15px);
    opacity: 0.65;
  }

  .mode-row{
    flex: 1;
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 3px;
    min-height: 0;
  }

  .mode-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    background: var(--panel);
    color: var(--text);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    font-size: clamp(14px, 4vh, 34px);
    text-align:center;
    padding: 8px;
    border:none;
    cursor:pointer;
  }
  .mode-btn[aria-pressed="true"]{
    background: var(--amber);
    color: #000;
  }

  .landing-top{
    flex: 1;
    display:flex;
    flex-direction:column;
    min-height: 0;
  }

  .landing-title-bar{
    flex: 0 0 auto;
    min-height: 44px;
    display:flex;
    align-items:center;
    justify-content:center;
    background: #1b1c1f;
    color: var(--amber);
    font-weight: 700;
    font-size: clamp(15px, 3.4vh, 26px);
    letter-spacing: 0.04em;
    text-align:center;
    padding: 6px 10px;
  }

  .name-inputs{
    flex: 1;
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 3px;
    min-height: 0;
  }

  .name-field{
    display:flex;
    min-width: 0;
    min-height: 0;
  }

  .landing-name-input{
    flex: 1;
    width: 100%;
    background: var(--panel);
    border: none;
    outline: none;
    color: inherit;
    font-weight: 900;
    text-align: center;
    letter-spacing: 0.03em;
    font-size: clamp(18px, 6vh, 56px);
    padding: 8px;
    font-family: inherit;
  }
  .landing-name-input.p1{ color: var(--p1); }
  .landing-name-input.p2{ color: var(--p2); }
  .landing-name-input:focus{
    outline: 4px solid var(--amber);
    outline-offset: -4px;
  }

  .landing-bottom{
    flex: 1;
    display:flex;
    flex-direction: column;
    gap: 3px;
    min-height: 0;
  }

  .swap-btn{
    flex: 0 0 auto;
    min-height: 56px;
    display:flex;
    align-items:center;
    justify-content:center;
    background: #1b1c1f;
    color: var(--amber);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: clamp(14px, 3vh, 22px);
    padding: 8px;
    text-align:center;
    border:none;
    cursor:pointer;
  }
  .swap-btn[disabled]{
    color: #6b6552;
    cursor: default;
  }
  .swap-btn[disabled]:active{ filter: none; }

  .ok-btn{
    flex: 1;
    display:flex;
    align-items:center;
    justify-content:center;
    background: var(--panel);
    color: var(--goal);
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-size: clamp(32px, 9vh, 90px);
    border:none;
    cursor:pointer;
  }

  /* ---------- SET SCORES BAR ---------- */
  .set-scores-bar{
    flex: 0 0 auto;
    display:grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 2px;
    background: var(--divider);
    min-height: 32px;
  }

  .set-score{
    display:flex;
    align-items:center;
    justify-content:center;
    background: #15161a;
    color: var(--text);
    font-weight: 700;
    font-size: clamp(10px, 2vh, 15px);
    letter-spacing: 0.03em;
    padding: 2px 4px;
    text-align:center;
  }

  /* ---------- SCORE DISPLAY ---------- */
  .scoreboard{
    flex: 1 1 0;
    display:flex;
    position:relative;
    min-height: 0;
  }
  .scoreboard:focus-visible{
    outline: 4px solid var(--amber);
    outline-offset: -4px;
  }

  .score-half{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: clamp(4px, 1.5vh, 12px);
    padding: 8px 4px;
    min-width:0;
  }

  .score-half.p1 .score-num{ color: var(--p1); text-shadow: 0 0 18px rgba(57,224,255,0.45); }
  .score-half.p2 .score-num{ color: var(--p2); text-shadow: 0 0 18px rgba(255,77,109,0.45); }


  .score-num{
    font-family: 'Courier New', Consolas, monospace;
    font-weight: 900;
    font-size: clamp(48px, 15vh, 180px);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  .serve-dots{
    display:flex;
    gap: 10px;
    height: clamp(14px, 2vh, 20px);
    align-items:center;
  }
  .serve-dot{
    width: clamp(10px, 1.6vh, 16px);
    height: clamp(10px, 1.6vh, 16px);
    border-radius: 50%;
    border: 2px solid var(--amber);
    background: transparent;
  }
  .serve-dot.filled{ background: var(--amber); }

  .center-divider{
    position:absolute;
    left:50%;
    top:8%;
    bottom:8%;
    width:2px;
    background: var(--divider);
    transform: translateX(-1px);
  }

  /* ---------- SERVE STATE BOX ---------- */
  .serve-state-bar{
    flex: 1 1 0;
    min-height: 0;
    display:flex;
    align-items:center;
    justify-content:center;
    background: #1b1c1f;
    color: var(--amber);
    font-weight: 700;
    font-size: clamp(13px, 2.6vh, 22px);
    letter-spacing: 0.04em;
    text-align:center;
    padding: 5px 10px;
    border-top: 2px solid var(--divider);
    border-bottom: 2px solid var(--divider);
  }

  .serve-state-bar.win{
    background: #1a2e1a;
    color: var(--goal);
  }

  .serve-state-bar.interactive{
    cursor: pointer;
  }
  .serve-state-bar.interactive:hover{
    filter: brightness(1.15);
  }
  .serve-state-bar.interactive:focus-visible{
    outline: 3px solid var(--amber);
    outline-offset: -3px;
  }

  .serve-state-bar[hidden]{
    display: none;
  }

  #countdownDisplay{
    cursor: default;
  }

  /* ---------- CONTROL BUTTONS ---------- */
  .controls{
    flex: 0 0 50dvh;
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: 1fr 1fr;
    gap: 3px;
    background: var(--divider);
    min-height:0;
  }

  .action-btn.wide{ grid-column: span 2; }

  button{
    border:none;
    margin:0;
    font-family: inherit;
    cursor:pointer;
    color: var(--text);
    display:flex;
    flex-direction: column;
    align-items:center;
    justify-content:center;
    gap: 4px;
    -webkit-user-select:none;
    user-select:none;
  }

  button:active{ filter: brightness(0.8); }
  button:focus-visible{ outline: 4px solid var(--amber); outline-offset: -4px; }

  .action-btn{
    background: var(--panel);
    line-height:1.1;
  }

  .action-btn[disabled]{
    opacity: 0.35;
    cursor: default;
  }
  .action-btn[disabled]:active{ filter:none; }

  .btn-player{
    font-size: clamp(13px, 2.8vh, 24px);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .action-btn.p1 .btn-player{ color: var(--p1); }
  .action-btn.p2 .btn-player{ color: var(--p2); }

  .btn-action{
    font-size: clamp(22px, 5.6vh, 50px);
    font-weight: 900;
  }
  .action-btn.goal .btn-action{ color: var(--goal); }
  .action-btn.foul .btn-action{ color: var(--foul); }

  /* ---------- WARNING / PENALTY / TIMEOUT ROW ---------- */
  .warn-penalty-row{
    flex: 0 0 32px;
    height: 32px;
    display:grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 3px;
    background: var(--divider);
  }
  .warn-penalty-row button{
    display:flex;
    align-items:center;
    justify-content:center;
    background: var(--panel);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    font-size: clamp(7px, 1.7vh, 11px);
    padding: 2px;
    text-align:center;
    line-height: 1.1;
  }
  .warn-penalty-row button.p1{ color: var(--p1); }
  .warn-penalty-row button.p2{ color: var(--p2); }
  .warn-penalty-row button[disabled]{ opacity: 0.35; cursor: default; }
  .warn-penalty-row button[disabled]:active{ filter: none; }
  .warn-penalty-row button.warn-toggle.active{
    background: var(--warn);
    color: #000;
  }

  /* ---------- BOTTOM BAR ---------- */
  .bottom-bar{
    flex: 0 0 32px;
    height: 32px;
    display:grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 3px;
    background: var(--divider);
  }

  .undo-btn{
    background: #1b1c1f;
    color: var(--amber);
    font-size: clamp(11px, 2.2vh, 16px);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .undo-btn[disabled]{
    color: #6b6552;
    cursor: default;
  }
  .undo-btn[disabled]:active{ filter:none; }

  .reset-btn{
    background: #3a1414;
    color: #FF8A80;
    font-size: clamp(11px, 2.2vh, 16px);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .back-to-names-btn{
    background: #1b1c1f;
    color: var(--amber);
    font-size: clamp(9px, 1.8vh, 14px);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  @media (orientation: landscape) and (max-height: 500px){
    .set-scores-bar{ min-height: 24px; }
    .serve-state-bar{ min-height: 30px; }
  }

  .sr-only{
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>
<body>

  <div class="page" id="landingPage">
    <div class="app-header">
      <div class="app-title" id="appTitle" tabindex="-1" role="text">ScoreDown</div>
      <div class="app-description">Your accessible showdown refereeing aid.</div>
      <div class="app-tip">Tip for iPhone users: In Safari, click Add to Home Screen to view this page like a traditional iPhone app.</div>
    </div>
    <div class="mode-row">
      <button type="button" class="mode-btn" id="singleSetModeBtn" aria-pressed="true">Single set</button>
      <button type="button" class="mode-btn" id="threeSetModeBtn" aria-pressed="false">3-set match</button>
    </div>
    <div class="landing-top">
      <div class="landing-title-bar" role="text">Enter player names:</div>
      <div class="name-inputs">
        <div class="name-field">
          <input type="text" class="landing-name-input p1" id="p1LandingNameInput" value="Player 1" maxlength="24">
        </div>
        <div class="name-field">
          <input type="text" class="landing-name-input p2" id="p2LandingNameInput" value="Player 2" maxlength="24">
        </div>
      </div>
    </div>
    <div class="landing-bottom">
      <button class="swap-btn" id="swapNamesBtn">Swap player names</button>
      <button class="ok-btn" id="okBtn">OK</button>
    </div>
  </div>

  <div class="page" id="scoreboardPage" hidden>

    <div class="set-scores-bar">
      <div class="set-score" id="setScore1">Set 1: ---</div>
      <div class="set-score" id="setScore2">Set 2: ---</div>
      <div class="set-score" id="setScore3">Set 3: ---</div>
    </div>

    <div class="scoreboard" id="scoreboardEl" tabindex="0" aria-label="0. 0.">
      <div class="center-divider"></div>
      <div class="score-half p1">
        <div class="score-num" id="score1" aria-hidden="true">0</div>
        <div class="serve-dots" id="dots1">
          <div class="serve-dot" id="dot1a"></div>
          <div class="serve-dot" id="dot1b"></div>
        </div>
      </div>
      <div class="score-half p2">
        <div class="score-num" id="score2" aria-hidden="true">0</div>
        <div class="serve-dots" id="dots2">
          <div class="serve-dot" id="dot2a"></div>
          <div class="serve-dot" id="dot2b"></div>
        </div>
      </div>
    </div>

    <div class="serve-state-bar" id="serveState" role="status" aria-live="polite">Player 1 &middot; 1st Serve</div>
    <button type="button" class="serve-state-bar interactive" id="changeEndsBtn" hidden></button>
    <button type="button" class="serve-state-bar interactive win" id="matchWinBtn" hidden></button>
    <button type="button" class="serve-state-bar" id="countdownDisplay" tabindex="-1" hidden></button>

    <div class="controls">
      <button class="action-btn goal p1 wide" id="p1goal" aria-label="Player 1 Goal">
        <span class="btn-player" id="p1goalLabel">Player 1</span>
        <span class="btn-action">GOAL</span>
      </button>
      <button class="action-btn goal p2 wide" id="p2goal" aria-label="Player 2 Goal">
        <span class="btn-player" id="p2goalLabel">Player 2</span>
        <span class="btn-action">GOAL</span>
      </button>
      <button class="action-btn foul p1 wide" id="p1foul" aria-label="Player 1 Foul">
        <span class="btn-player" id="p1foulLabel">Player 1</span>
        <span class="btn-action">FOUL</span>
      </button>
      <button class="action-btn foul p2 wide" id="p2foul" aria-label="Player 2 Foul">
        <span class="btn-player" id="p2foulLabel">Player 2</span>
        <span class="btn-action">FOUL</span>
      </button>
    </div>

    <div class="warn-penalty-row">
      <button class="p1 warn-toggle" id="p1WarnBtn" aria-pressed="false">Warning Player 1</button>
      <button class="p1" id="p1PenaltyBtn">Penalty Player 1</button>
      <button class="p1" id="p1timeout">Timeout Player 1</button>
      <button class="p2 warn-toggle" id="p2WarnBtn" aria-pressed="false">Warning Player 2</button>
      <button class="p2" id="p2PenaltyBtn">Penalty Player 2</button>
      <button class="p2" id="p2timeout">Timeout Player 2</button>
    </div>

    <div class="bottom-bar">
      <button class="undo-btn" id="undoBtn" disabled>Undo</button>
      <button class="reset-btn" id="resetBtn">Reset</button>
      <button class="back-to-names-btn" id="backToNamesBtn">Back to names</button>
    </div>

    <div id="announcer" class="sr-only" aria-live="polite" role="status"></div>

    <audio id="winSound" src="win.mp3" preload="auto"></audio>

  </div>

  <div class="page" id="singleSetScoreboardPage" hidden>

    <div class="scoreboard" id="scoreboardElSs" tabindex="0" aria-label="0. 0.">
      <div class="center-divider"></div>
      <div class="score-half p1">
        <div class="score-num" id="score1Ss" aria-hidden="true">0</div>
        <div class="serve-dots" id="dots1Ss">
          <div class="serve-dot" id="dot1aSs"></div>
          <div class="serve-dot" id="dot1bSs"></div>
        </div>
      </div>
      <div class="score-half p2">
        <div class="score-num" id="score2Ss" aria-hidden="true">0</div>
        <div class="serve-dots" id="dots2Ss">
          <div class="serve-dot" id="dot2aSs"></div>
          <div class="serve-dot" id="dot2bSs"></div>
        </div>
      </div>
    </div>

    <div class="serve-state-bar" id="serveStateSs" role="status" aria-live="polite">Player 1 &middot; 1st Serve</div>
    <button type="button" class="serve-state-bar interactive win" id="matchWinBtnSs" hidden></button>
    <button type="button" class="serve-state-bar" id="countdownDisplaySs" tabindex="-1" hidden></button>

    <div class="controls">
      <button class="action-btn goal p1 wide" id="p1goalSs" aria-label="Player 1 Goal">
        <span class="btn-player" id="p1goalLabelSs">Player 1</span>
        <span class="btn-action">GOAL</span>
      </button>
      <button class="action-btn goal p2 wide" id="p2goalSs" aria-label="Player 2 Goal">
        <span class="btn-player" id="p2goalLabelSs">Player 2</span>
        <span class="btn-action">GOAL</span>
      </button>
      <button class="action-btn foul p1 wide" id="p1foulSs" aria-label="Player 1 Foul">
        <span class="btn-player" id="p1foulLabelSs">Player 1</span>
        <span class="btn-action">FOUL</span>
      </button>
      <button class="action-btn foul p2 wide" id="p2foulSs" aria-label="Player 2 Foul">
        <span class="btn-player" id="p2foulLabelSs">Player 2</span>
        <span class="btn-action">FOUL</span>
      </button>
    </div>

    <div class="warn-penalty-row">
      <button class="p1 warn-toggle" id="p1WarnBtnSs" aria-pressed="false">Warning Player 1</button>
      <button class="p1" id="p1PenaltyBtnSs">Penalty Player 1</button>
      <button class="p1" id="p1timeoutSs">Timeout Player 1</button>
      <button class="p2 warn-toggle" id="p2WarnBtnSs" aria-pressed="false">Warning Player 2</button>
      <button class="p2" id="p2PenaltyBtnSs">Penalty Player 2</button>
      <button class="p2" id="p2timeoutSs">Timeout Player 2</button>
    </div>

    <div class="bottom-bar">
      <button class="undo-btn" id="undoBtnSs" disabled>Undo</button>
      <button class="reset-btn" id="resetBtnSs">Reset</button>
      <button class="back-to-names-btn" id="backToNamesBtnSs">Back to names</button>
    </div>

    <div id="announcerSs" class="sr-only" aria-live="polite" role="status"></div>

    <audio id="winSoundSs" src="win.mp3" preload="auto"></audio>

  </div>

<script>
  // ============================================================
  // LANDING PAGE
  // ============================================================
  const landingPage = document.getElementById('landingPage');
  const scoreboardPage = document.getElementById('scoreboardPage');
  const p1LandingNameInput = document.getElementById('p1LandingNameInput');
  const p2LandingNameInput = document.getElementById('p2LandingNameInput');
  const okBtn = document.getElementById('okBtn');
  const swapNamesBtn = document.getElementById('swapNamesBtn');
  const singleSetModeBtn = document.getElementById('singleSetModeBtn');
  const threeSetModeBtn = document.getElementById('threeSetModeBtn');

  let selectedMode = 'singleSet'; // 'singleSet' | 'threeSet'

  function updateModeButtons(){
    singleSetModeBtn.setAttribute('aria-pressed', selectedMode === 'singleSet' ? 'true' : 'false');
    threeSetModeBtn.setAttribute('aria-pressed', selectedMode === 'threeSet' ? 'true' : 'false');
  }

  singleSetModeBtn.addEventListener('click', () => {
    selectedMode = 'singleSet';
    updateModeButtons();
  });
  threeSetModeBtn.addEventListener('click', () => {
    selectedMode = 'threeSet';
    updateModeButtons();
  });

  function updateSwapButtonState(){
    swapNamesBtn.disabled = (p1LandingNameInput.value === 'Player 1' || p2LandingNameInput.value === 'Player 2');
  }

  p1LandingNameInput.addEventListener('focus', () => { p1LandingNameInput.value = ''; updateSwapButtonState(); });
  p2LandingNameInput.addEventListener('focus', () => { p2LandingNameInput.value = ''; updateSwapButtonState(); });

  p1LandingNameInput.addEventListener('input', updateSwapButtonState);
  p2LandingNameInput.addEventListener('input', updateSwapButtonState);

  p1LandingNameInput.addEventListener('blur', () => {
    if(p1LandingNameInput.value.trim() === ''){ p1LandingNameInput.value = 'Player 1'; }
    updateSwapButtonState();
  });
  p2LandingNameInput.addEventListener('blur', () => {
    if(p2LandingNameInput.value.trim() === ''){ p2LandingNameInput.value = 'Player 2'; }
    updateSwapButtonState();
  });

  p1LandingNameInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){ e.preventDefault(); p1LandingNameInput.blur(); }
  });
  p2LandingNameInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){ e.preventDefault(); p2LandingNameInput.blur(); }
  });

  swapNamesBtn.addEventListener('click', () => {
    swapNamesBtn.blur();
    const temp = p1LandingNameInput.value;
    p1LandingNameInput.value = p2LandingNameInput.value;
    p2LandingNameInput.value = temp;
    updateSwapButtonState();
  });

  okBtn.addEventListener('click', () => {
    okBtn.blur();

    if(selectedMode === 'singleSet'){
      if(!ssPointsScoredSinceReset){ ssMatchStartTime = new Date(); }
      ssSetPlayerNames(p1LandingNameInput.value, p2LandingNameInput.value);
      landingPage.hidden = true;
      singleSetScoreboardPage.hidden = false;
    } else {
      if(!pointsScoredSinceReset){ matchStartTime = new Date(); }
      setPlayerNames(p1LandingNameInput.value, p2LandingNameInput.value);
      landingPage.hidden = true;
      scoreboardPage.hidden = false;
    }
  });

  updateSwapButtonState();
  updateModeButtons();

  // ============================================================
  // SCOREBOARD PAGE (unchanged from the match-tracker version)
  // ============================================================
  let score1 = 0;
  let score2 = 0;
  // serve state: 0 = P1 1st, 1 = P1 2nd, 2 = P2 1st, 3 = P2 2nd
  let serveState = 0;
  let history = []; // { type, player, amount?, prevServe? }
  let winner = null; // null, 1, or 2 -- winner of the CURRENT set
  let player1Name = 'Player 1';
  let player2Name = 'Player 2';
  let p1WarningIssued = false;
  let p2WarningIssued = false;
  let p1TimeoutUsed = false;
  let p2TimeoutUsed = false;
  let timeoutActive = false;
  let timeoutIntervalId = null;
  let activeCountdownFinisher = null; // whichever countdown's "finish now" function is currently running
  let matchStartTime = null; // set once, the first time OK is pressed
  let matchEndTime = null; // set when the match-winner message is displayed
  let pointsScoredSinceReset = false;

  // Match / set state
  let currentSet = 1; // 1, 2, or 3
  let setsWonP1 = 0;
  let setsWonP2 = 0;
  let setScores = [null, null, null]; // { p1, p2 } per completed set
  let matchOver = false;
  let setTransitionTimeoutId = null;

  // "Change ends" (set 3 threshold, and between every set) — interactive countdown
  let changeEndsTriggered = false; // once-per-match latch for the mid-set-3 threshold rule
  let changeEndsState = 'idle'; // 'idle' | 'pending' | 'counting'
  let changeEndsIntervalId = null;
  let changeEndsOnComplete = null; // function to run once the 60s countdown finishes (e.g. move to next set)
  let changeEndsCompletionMessage = null; // what to announce when the countdown finishes

  const score1El = document.getElementById('score1');
  const score2El = document.getElementById('score2');
  const scoreboardEl = document.getElementById('scoreboardEl');
  const serveStateEl = document.getElementById('serveState');
  const changeEndsBtn = document.getElementById('changeEndsBtn');
  const matchWinBtn = document.getElementById('matchWinBtn');
  const countdownEl = document.getElementById('countdownDisplay');
  const undoBtn = document.getElementById('undoBtn');
  const backToNamesBtn = document.getElementById('backToNamesBtn');
  const announcer = document.getElementById('announcer');
  const winSound = document.getElementById('winSound');
  const p1goalBtn = document.getElementById('p1goal');
  const p2goalBtn = document.getElementById('p2goal');
  const p1foulBtn = document.getElementById('p1foul');
  const p2foulBtn = document.getElementById('p2foul');
  const p1WarnBtn = document.getElementById('p1WarnBtn');
  const p2WarnBtn = document.getElementById('p2WarnBtn');
  const p1PenaltyBtn = document.getElementById('p1PenaltyBtn');
  const p2PenaltyBtn = document.getElementById('p2PenaltyBtn');
  const p1timeoutBtn = document.getElementById('p1timeout');
  const p2timeoutBtn = document.getElementById('p2timeout');
  const p1goalLabel = document.getElementById('p1goalLabel');
  const p2goalLabel = document.getElementById('p2goalLabel');
  const p1foulLabel = document.getElementById('p1foulLabel');
  const p2foulLabel = document.getElementById('p2foulLabel');
  const actionButtons = [p1goalBtn, p2goalBtn, p1foulBtn, p2foulBtn, p1WarnBtn, p2WarnBtn, p1PenaltyBtn, p2PenaltyBtn];
  const setScoreEls = [
    document.getElementById('setScore1'),
    document.getElementById('setScore2'),
    document.getElementById('setScore3')
  ];

  const dots = {
    1: [document.getElementById('dot1a'), document.getElementById('dot1b')],
    2: [document.getElementById('dot2a'), document.getElementById('dot2b')]
  };

  function getServeLabels(){
    return [
      player1Name + ' \u00b7 1st Serve',
      player1Name + ' \u00b7 2nd Serve',
      player2Name + ' \u00b7 1st Serve',
      player2Name + ' \u00b7 2nd Serve'
    ];
  }

  function announce(message){
    // Clear first so repeated identical messages are still announced
    announcer.textContent = '';
    setTimeout(() => { announcer.textContent = message; }, 50);
  }

  function afterSound(audioEl, callback){
    let finished = false;
    const finish = () => {
      if(finished) return;
      finished = true;
      audioEl.removeEventListener('ended', finish);
      audioEl.removeEventListener('error', finish);
      callback();
    };
    audioEl.addEventListener('ended', finish);
    audioEl.addEventListener('error', finish);
    audioEl.currentTime = 0;
    const playPromise = audioEl.play();
    if(playPromise && typeof playPromise.catch === 'function'){
      playPromise.catch(finish);
    }
  }

  function serveLabelForState(state){
    return getServeLabels()[state];
  }

  function formatMatchBeganText(){
    if(!matchStartTime) return 'Unknown';
    const dateStr = matchStartTime.toLocaleDateString();
    const timeStr = matchStartTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    return dateStr + ' ' + timeStr;
  }

  function formatMatchLengthText(){
    if(!matchStartTime || !matchEndTime) return 'Unknown';
    const totalSeconds = Math.max(0, Math.round((matchEndTime - matchStartTime) / 1000));
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;
    return minutes + ' minutes ' + seconds + ' seconds';
  }

  function computeMatchStats(){
    const stats = {
      1: { total: 0, goals: 0, fouls: 0, penalties: 0 },
      2: { total: 0, goals: 0, fouls: 0, penalties: 0 }
    };

    history.forEach(entry => {
      if(entry.type === 'score'){
        const p = entry.player;
        if(entry.amount === 2){ stats[p].goals += entry.amount; }
        else if(entry.amount === 1){ stats[p].fouls += entry.amount; }
        stats[p].total += entry.amount;
      } else if(entry.type === 'penalty'){
        const opponent = entry.player === 1 ? 2 : 1;
        stats[opponent].penalties += 2;
        stats[opponent].total += 2;
      }
    });

    return stats;
  }

  function buildSetDetailsSections(){
    const sections = [];
    let currentSetNumber = 1;
    let runningScore1 = 0;
    let runningScore2 = 0;
    let lines = [];

    history.forEach(entry => {
      if(entry.type === 'setTransition'){
        sections.push({ setNumber: currentSetNumber, lines: lines });
        currentSetNumber = entry.completedSet + 1;
        runningScore1 = 0;
        runningScore2 = 0;
        lines = [];
        return;
      }

      if(entry.type === 'score'){
        if(entry.player === 1){ runningScore1 += entry.amount; } else { runningScore2 += entry.amount; }
        if(entry.amount === 2){
          // Goal: the scoring player is entry.player
          const scorerName = entry.player === 1 ? player1Name : player2Name;
          lines.push(serveLabelForState(entry.prevServe) + ' - ' + scorerName + ' Goal - ' + runningScore1 + '-' + runningScore2);
        } else {
          // Foul: entry.player is who RECEIVES the point; the committing player is the other one
          const committingName = entry.player === 1 ? player2Name : player1Name;
          lines.push(serveLabelForState(entry.prevServe) + ' - ' + committingName + ' Foul - ' + runningScore1 + '-' + runningScore2);
        }
      } else if(entry.type === 'penalty'){
        const opponent = entry.player === 1 ? 2 : 1;
        if(opponent === 1){ runningScore1 += 2; } else { runningScore2 += 2; }
        const committingName = entry.player === 1 ? player1Name : player2Name;
        lines.push(committingName + ' Penalty - ' + runningScore1 + '-' + runningScore2);
      } else if(entry.type === 'warning'){
        const name = entry.player === 1 ? player1Name : player2Name;
        lines.push(name + ' warning');
      } else if(entry.type === 'timeout'){
        const name = entry.player === 1 ? player1Name : player2Name;
        lines.push(name + ' time out');
      }
    });

    sections.push({ setNumber: currentSetNumber, lines: lines });

    return sections;
  }

  function buildMatchSummaryText(){
    const winnerName = winner === 1 ? player1Name : player2Name;
    const winnerSets = winner === 1 ? setsWonP1 : setsWonP2;
    const loserSets = winner === 1 ? setsWonP2 : setsWonP1;

    const lines = [];
    lines.push('Showdown Match Report');
    lines.push('======================');
    lines.push('');
    lines.push(player1Name + ' vs ' + player2Name);
    lines.push('3-set match');
    lines.push('Winner: ' + winnerName + ' (' + winnerSets + '-' + loserSets + ' in sets)');
    lines.push('Match began: ' + formatMatchBeganText());
    lines.push('Match length: ' + formatMatchLengthText());
    lines.push('');
    lines.push('Set scores:');
    for(let i = 0; i < 3; i++){
      if(setScores[i]){
        lines.push('  Set ' + (i + 1) + ': ' + player1Name + ' ' + setScores[i].p1 + ' - ' + setScores[i].p2 + ' ' + player2Name);
      }
    }
    lines.push('');

    const stats = computeMatchStats();
    lines.push('Player points');
    lines.push('-------------');
    lines.push(player1Name + ' total points: ' + stats[1].total);
    lines.push(player1Name + ' points from goals: ' + stats[1].goals);
    lines.push(player1Name + ' points from fouls: ' + stats[1].fouls);
    lines.push(player1Name + ' points from penalties: ' + stats[1].penalties);
    lines.push(player2Name + ' total points: ' + stats[2].total);
    lines.push(player2Name + ' points from goals: ' + stats[2].goals);
    lines.push(player2Name + ' points from fouls: ' + stats[2].fouls);
    lines.push(player2Name + ' points from penalties: ' + stats[2].penalties);

    const setSections = buildSetDetailsSections();
    setSections.forEach(section => {
      if(!setScores[section.setNumber - 1]) return; // only report sets that actually completed
      lines.push('');
      lines.push('Set ' + section.setNumber + ' Details');
      lines.push('-'.repeat(('Set ' + section.setNumber + ' Details').length));
      section.lines.forEach(line => { lines.push(line); });
    });

    return lines.join('\n');
  }

  function sanitizeForFilename(name){
    return name.trim().replace(/[^a-z0-9]+/gi, '_') || 'player';
  }

  function downloadMatchSummary(){
    const text = buildMatchSummaryText();
    const blob = new Blob([text], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);

    const filename = 'match-result-' + sanitizeForFilename(player1Name) + '-vs-' + sanitizeForFilename(player2Name) + '.txt';

    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function announceScores(){
    const won = checkWin();
    if(won === 1){
      announce(score1 + '. ' + score2 + '.');
    } else if(won === 2){
      announce(score2 + '. ' + score1 + '.');
    } else if(serveState === 2 || serveState === 3){
      announce(score2 + '. ' + score1 + '.');
    } else {
      announce(score1 + '. ' + score2 + '.');
    }
  }

  function renderScores(){
    score1El.textContent = score1;
    score2El.textContent = score2;
    scoreboardEl.setAttribute('aria-label', score1 + '. ' + score2 + '.');
  }

  function renderSetScores(){
    for(let i = 0; i < 3; i++){
      const s = setScores[i];
      setScoreEls[i].textContent = 'Set ' + (i + 1) + ': ' + (s ? (s.p1 + '-' + s.p2) : '---');
    }
  }

  function currentServeDisplayText(){
    if(matchOver){
      const winnerName = winner === 1 ? player1Name : player2Name;
      const scoreText = winner === 1 ? (setsWonP1 + '-' + setsWonP2) : (setsWonP2 + '-' + setsWonP1);
      return winnerName + ' wins the match: ' + scoreText;
    }
    if(winner !== null){
      return (winner === 1 ? player1Name : player2Name) + ' wins set ' + currentSet;
    }
    return getServeLabels()[serveState];
  }

  function renderServe(){
    if(!timeoutActive && changeEndsState === 'idle'){
      serveStateEl.textContent = currentServeDisplayText();
      serveStateEl.classList.toggle('win', matchOver || winner !== null);
    }

    const servingPlayer = serveState < 2 ? 1 : 2;
    const filledCount = (serveState % 2 === 0) ? 1 : 2;

    [1,2].forEach(player => {
      dots[player].forEach((dot, i) => {
        const isServer = player === servingPlayer;
        dot.classList.toggle('filled', isServer && i < filledCount);
        dot.style.visibility = isServer ? 'visible' : 'hidden';
      });
    });
  }

  function updateUndoState(){
    undoBtn.disabled = history.length === 0;
  }

  function checkWin(){
    if(score1 >= 11 && score1 - score2 >= 2) return 1;
    if(score2 >= 11 && score2 - score1 >= 2) return 2;
    return null;
  }

  function setActionButtonsDisabled(disabled){
    actionButtons.forEach(btn => { btn.disabled = disabled; });
  }

  function refreshButtonStates(){
    const blocked = winner !== null || timeoutActive || changeEndsState !== 'idle';
    setActionButtonsDisabled(blocked);
    p1timeoutBtn.disabled = blocked || p1TimeoutUsed;
    p2timeoutBtn.disabled = blocked || p2TimeoutUsed;
  }

  function finalizeSetWin(player){
    winner = player;
    refreshButtonStates();

    setScores[currentSet - 1] = { p1: score1, p2: score2 };
    renderSetScores();

    if(player === 1){ setsWonP1++; } else { setsWonP2++; }

    if(setsWonP1 === 2 || setsWonP2 === 2){
      matchOver = true;
    }

    afterSound(winSound, () => {
      if(winner !== player) return; // the win was undone while the sound was still playing

      if(matchOver){
        matchEndTime = new Date();
        const winnerName = player === 1 ? player1Name : player2Name;
        const scoreText = player === 1 ? (setsWonP1 + '-' + setsWonP2) : (setsWonP2 + '-' + setsWonP1);
        matchWinBtn.textContent = winnerName + ' wins the match: ' + scoreText + '. Press to download results.';
        showServeBarMode('matchWin');
        setTimeout(() => { matchWinBtn.focus(); }, 0);
        return;
      }

      renderServe();

      setTimeout(() => {
        if(winner !== player) return;

        announceScores();

        const nextServePlayer = (currentSet === 1) ? 2 : 1;
        const nextSetNumber = currentSet + 1;
        if(setTransitionTimeoutId){ clearTimeout(setTransitionTimeoutId); }
        setTransitionTimeoutId = setTimeout(() => {
          setTransitionTimeoutId = null;
          showChangeEndsPrompt(() => { softResetForNextSet(nextServePlayer); }, 'Set ' + nextSetNumber);
        }, 4000);
      }, 500);
    });
  }

  function clearSetWin(){
    // Undo has reversed the point that had just finalized a set: unwind that finalization
    if(setTransitionTimeoutId){ clearTimeout(setTransitionTimeoutId); setTransitionTimeoutId = null; }

    if(changeEndsState !== 'idle'){
      if(changeEndsIntervalId){ clearInterval(changeEndsIntervalId); changeEndsIntervalId = null; }
      changeEndsState = 'idle';
      changeEndsOnComplete = null;
      changeEndsCompletionMessage = null;
      activeCountdownFinisher = null;
    }
    showServeBarMode('status');

    if(winner === 1){ setsWonP1--; } else if(winner === 2){ setsWonP2--; }
    setScores[currentSet - 1] = null;
    renderSetScores();

    matchOver = false;
    winner = null;
    refreshButtonStates();
    renderServe();
  }

  function softResetForNextSet(startServePlayer){
    history.push({
      type: 'setTransition',
      completedSet: currentSet,
      winner: winner,
      scoreAtEnd: { p1: score1, p2: score2 },
      serveStateAtEnd: serveState,
      warningAtEnd: { p1: p1WarningIssued, p2: p2WarningIssued },
      timeoutUsedAtEnd: { p1: p1TimeoutUsed, p2: p2TimeoutUsed }
    });

    currentSet++;
    winner = null;
    score1 = 0;
    score2 = 0;
    serveState = (startServePlayer === 1) ? 0 : 2;
    p1WarningIssued = false;
    p2WarningIssued = false;
    p1TimeoutUsed = false;
    p2TimeoutUsed = false;

    refreshButtonStates();
    renderScores();
    updateUndoState();
    updateWarnIndicatorUI(1);
    updateWarnIndicatorUI(2);
  }

  function applyWinCheck(){
    const won = checkWin();
    if(won && winner === null){
      finalizeSetWin(won);
    } else if(!won && winner !== null){
      clearSetWin();
    }
  }

  function checkChangeEnds(){
    if(currentSet !== 3 || changeEndsTriggered) return;
    if(score1 === 6 || score1 === 7 || score2 === 6 || score2 === 7){
      changeEndsTriggered = true;
      showChangeEndsPrompt(null);
      refreshButtonStates();
    }
  }

  changeEndsBtn.addEventListener('click', () => {
    startChangeEndsCountdown();
  });

  matchWinBtn.addEventListener('click', () => {
    downloadMatchSummary();
  });

  countdownEl.addEventListener('click', () => {
    if(activeCountdownFinisher){
      activeCountdownFinisher();
    }
  });

  function showChangeEndsPrompt(onComplete, completionMessage){
    changeEndsState = 'pending';
    changeEndsOnComplete = onComplete;
    changeEndsCompletionMessage = completionMessage || 'Change ends over';
    serveStateEl.classList.remove('win');
    changeEndsBtn.textContent = 'Change ends, press to start 60-second countdown';
    showServeBarMode('button');
    setTimeout(() => { changeEndsBtn.focus(); }, 0);
  }

  function startChangeEndsCountdown(){
    if(changeEndsState !== 'pending') return;

    changeEndsState = 'counting';
    showServeBarMode('countdown');

    // Move focus to the countdown display, but with no content yet, so screen readers
    // register the focus move without reading anything at that moment.
    countdownEl.textContent = '';
    announce('60 seconds started');

    setTimeout(() => {
      countdownEl.focus();

      setTimeout(() => {
        let remaining = 60;
        countdownEl.textContent = 'Change ends: ' + remaining;

        function finishChangeEndsCountdown(){
          clearInterval(changeEndsIntervalId);
          changeEndsIntervalId = null;
          changeEndsState = 'idle';
          activeCountdownFinisher = null;
          refreshButtonStates();

          const onComplete = changeEndsOnComplete;
          const isMidSetTrigger = !onComplete;
          changeEndsOnComplete = null;

          announce(changeEndsCompletionMessage);
          changeEndsCompletionMessage = null;

          setTimeout(() => {
            if(onComplete){ onComplete(); }
            showServeBarMode('status');
            serveStateEl.textContent = '';

            setTimeout(() => {
              renderServe();

              if(isMidSetTrigger){
                setTimeout(() => { announceScores(); }, 500);
              }
            }, 60);
          }, 500);
        }

        activeCountdownFinisher = finishChangeEndsCountdown;

        changeEndsIntervalId = setInterval(() => {
          remaining--;

          if(remaining > 15){
            countdownEl.textContent = 'Change ends: ' + remaining;
          } else if(remaining > 0){
            const text = remaining + ' seconds';
            countdownEl.textContent = text;
            if(remaining === 15){ announce(text); }
          }

          if(remaining <= 0){
            finishChangeEndsCountdown();
          }
        }, 1000);
      }, 60);
    }, 0);
  }

  function rearmChangeEndsIfUndone(){
    if(currentSet !== 3 || !changeEndsTriggered) return;
    if(score1 === 6 || score1 === 7 || score2 === 6 || score2 === 7) return;

    changeEndsTriggered = false;

    if(changeEndsState !== 'idle'){
      if(changeEndsIntervalId){ clearInterval(changeEndsIntervalId); changeEndsIntervalId = null; }
      changeEndsState = 'idle';
      changeEndsOnComplete = null;
      changeEndsCompletionMessage = null;
      activeCountdownFinisher = null;
      showServeBarMode('status');
      refreshButtonStates();
      renderServe();
    }
  }

  function showServeBarMode(mode){
    // mode: 'status' | 'button' | 'countdown' | 'matchWin'
    serveStateEl.hidden = (mode !== 'status');
    changeEndsBtn.hidden = (mode !== 'button');
    countdownEl.hidden = (mode !== 'countdown');
    matchWinBtn.hidden = (mode !== 'matchWin');
  }

  function addPoints(player, amount){
    if(winner !== null) return;

    const prevServe = serveState;
    if(player === 1){ score1 += amount; } else { score2 += amount; }
    history.push({ type: 'score', player, amount, prevServe });
    serveState = (serveState + 1) % 4;
    pointsScoredSinceReset = true;

    renderScores();
    renderServe();

    const wonNow = checkWin();
    if(!wonNow){ announceScores(); }

    updateUndoState();
    checkChangeEnds();
    applyWinCheck();
  }

  function updateWarnIndicatorUI(player){
    const issued = player === 1 ? p1WarningIssued : p2WarningIssued;
    const btn = player === 1 ? p1WarnBtn : p2WarnBtn;
    btn.classList.toggle('active', issued);
    btn.setAttribute('aria-pressed', issued ? 'true' : 'false');
  }

  function toggleWarningIndicator(player){
    if(winner !== null) return;

    if(player === 1){ p1WarningIssued = !p1WarningIssued; } else { p2WarningIssued = !p2WarningIssued; }
    history.push({ type: 'warning', player });
    updateWarnIndicatorUI(player);
    updateUndoState();
  }

  function handlePenaltyPress(penalizingPlayer){
    if(winner !== null) return;

    const opponent = penalizingPlayer === 1 ? 2 : 1;
    if(opponent === 1){ score1 += 2; } else { score2 += 2; }
    history.push({ type: 'penalty', player: penalizingPlayer, prevServe: serveState });
    pointsScoredSinceReset = true;

    const wonNow = checkWin();

    renderScores();
    if(!wonNow){ announceScores(); }
    updateUndoState();
    checkChangeEnds();
    applyWinCheck();
  }

  function refreshNameDependentUI(){
    p1goalLabel.textContent = player1Name;
    p1foulLabel.textContent = player1Name;
    p2goalLabel.textContent = player2Name;
    p2foulLabel.textContent = player2Name;

    p1goalBtn.setAttribute('aria-label', player1Name + ' Goal');
    p1foulBtn.setAttribute('aria-label', player1Name + ' Foul');
    p2goalBtn.setAttribute('aria-label', player2Name + ' Goal');
    p2foulBtn.setAttribute('aria-label', player2Name + ' Foul');

    p1WarnBtn.textContent = 'Warning ' + player1Name;
    p2WarnBtn.textContent = 'Warning ' + player2Name;
    p1PenaltyBtn.textContent = 'Penalty ' + player1Name;
    p2PenaltyBtn.textContent = 'Penalty ' + player2Name;
    updateWarnIndicatorUI(1);
    updateWarnIndicatorUI(2);

    p1timeoutBtn.textContent = 'Timeout ' + player1Name;
    p2timeoutBtn.textContent = 'Timeout ' + player2Name;

    renderServe();
  }

  function setPlayerNames(name1, name2){
    player1Name = name1.trim() || 'Player 1';
    player2Name = name2.trim() || 'Player 2';
    refreshNameDependentUI();
  }

  document.getElementById('p1goal').addEventListener('click', () => addPoints(1, 2));
  document.getElementById('p2goal').addEventListener('click', () => addPoints(2, 2));
  document.getElementById('p1foul').addEventListener('click', () => addPoints(2, 1));
  document.getElementById('p2foul').addEventListener('click', () => addPoints(1, 1));

  p1WarnBtn.addEventListener('click', () => toggleWarningIndicator(1));
  p2WarnBtn.addEventListener('click', () => toggleWarningIndicator(2));

  p1PenaltyBtn.addEventListener('click', () => handlePenaltyPress(1));
  p2PenaltyBtn.addEventListener('click', () => handlePenaltyPress(2));

  function startTimeout(player){
    if(winner !== null || timeoutActive) return;
    const used = player === 1 ? p1TimeoutUsed : p2TimeoutUsed;
    if(used) return;

    if(player === 1){ p1TimeoutUsed = true; } else { p2TimeoutUsed = true; }
    timeoutActive = true;
    history.push({ type: 'timeout', player });
    updateUndoState();
    refreshButtonStates();

    const name = player === 1 ? player1Name : player2Name;

    serveStateEl.classList.remove('win');
    showServeBarMode('countdown');

    // Move focus to the countdown display, but with no content yet, so screen readers
    // register the focus move without reading anything at that moment.
    countdownEl.textContent = '';
    announce('60 seconds started');

    setTimeout(() => {
      countdownEl.focus();

      setTimeout(() => {
        let remaining = 60;
        countdownEl.textContent = name + ' Time Out: ' + remaining;

        function finishTimeoutCountdown(){
          clearInterval(timeoutIntervalId);
          timeoutIntervalId = null;
          timeoutActive = false;
          activeCountdownFinisher = null;
          refreshButtonStates();

          announce('Time out over');

          setTimeout(() => {
            showServeBarMode('status');
            serveStateEl.textContent = '';

            setTimeout(() => {
              renderServe();
              setTimeout(() => { announceScores(); }, 500);
            }, 60);
          }, 500);
        }

        activeCountdownFinisher = finishTimeoutCountdown;

        timeoutIntervalId = setInterval(() => {
          remaining--;

          if(remaining > 15){
            countdownEl.textContent = name + ' Time Out: ' + remaining;
          } else if(remaining > 0){
            const text = remaining + ' seconds';
            countdownEl.textContent = text;
            if(remaining === 15){ announce(text); }
          }

          if(remaining <= 0){
            finishTimeoutCountdown();
          }
        }, 1000);
      }, 60);
    }, 0);
  }

  p1timeoutBtn.addEventListener('click', () => startTimeout(1));
  p2timeoutBtn.addEventListener('click', () => startTimeout(2));

  undoBtn.addEventListener('click', () => {
    if(history.length === 0) return;
    let last = history.pop();

    // Step back through any set-boundary marker(s) first, restoring set-level state,
    // then continue to the actual scoring action that ended that set.
    while(last && last.type === 'setTransition'){
      currentSet = last.completedSet;
      score1 = last.scoreAtEnd.p1;
      score2 = last.scoreAtEnd.p2;
      serveState = last.serveStateAtEnd;
      p1WarningIssued = last.warningAtEnd.p1;
      p2WarningIssued = last.warningAtEnd.p2;
      p1TimeoutUsed = last.timeoutUsedAtEnd.p1;
      p2TimeoutUsed = last.timeoutUsedAtEnd.p2;
      if(last.winner === 1){ setsWonP1--; } else { setsWonP2--; }
      setScores[last.completedSet - 1] = null;
      matchOver = false;
      winner = null;
      renderSetScores();

      last = history.length ? history.pop() : null;
    }

    if(!last){
      refreshButtonStates();
      renderScores();
      renderServe();
      updateUndoState();
      updateWarnIndicatorUI(1);
      updateWarnIndicatorUI(2);
      return;
    }

    if(last.type === 'score'){
      if(last.player === 1){ score1 -= last.amount; } else { score2 -= last.amount; }
      serveState = last.prevServe;

      refreshButtonStates();
      renderScores();
      renderServe();
      announceScores();
      updateUndoState();
      updateWarnIndicatorUI(1);
      updateWarnIndicatorUI(2);
      rearmChangeEndsIfUndone();
      applyWinCheck();

    } else if(last.type === 'warning'){
      if(last.player === 1){ p1WarningIssued = false; } else { p2WarningIssued = false; }
      refreshButtonStates();
      renderScores();
      renderServe();
      updateWarnIndicatorUI(last.player);
      updateUndoState();

    } else if(last.type === 'penalty'){
      const opponent = last.player === 1 ? 2 : 1;
      if(opponent === 1){ score1 -= 2; } else { score2 -= 2; }

      refreshButtonStates();
      renderScores();
      renderServe();
      announceScores();
      updateWarnIndicatorUI(1);
      updateWarnIndicatorUI(2);
      updateUndoState();
      rearmChangeEndsIfUndone();
      applyWinCheck();

    } else if(last.type === 'timeout'){
      if(timeoutActive && timeoutIntervalId !== null){
        clearInterval(timeoutIntervalId);
        timeoutIntervalId = null;
        timeoutActive = false;
        activeCountdownFinisher = null;
        showServeBarMode('status');
      }

      if(last.player === 1){ p1TimeoutUsed = false; } else { p2TimeoutUsed = false; }

      refreshButtonStates();
      renderScores();
      renderServe();
      updateUndoState();
    }
  });

  function ssGetServeLabels(){
    return [
      ssPlayer1Name + ' \u00b7 1st Serve',

      ssPlayer2Name + ' \u00b7 1st Serve',
      ssPlayer2Name + ' \u00b7 2nd Serve'
    ];
  }

  function ssAnnounce(message){
    ssAnnouncer.textContent = '';
    setTimeout(() => { ssAnnouncer.textContent = message; }, 50);
  }

  function ssAfterSound(audioEl, callback){
    let finished = false;
    const finish = () => {
      if(finished) return;
      finished = true;
      audioEl.removeEventListener('ended', finish);
      audioEl.removeEventListener('error', finish);
      callback();
    };
    audioEl.addEventListener('ended', finish);
    audioEl.addEventListener('error', finish);
    audioEl.currentTime = 0;
    const playPromise = audioEl.play();
    if(playPromise && typeof playPromise.catch === 'function'){
      playPromise.catch(finish);
    }
  }

  function ssServeLabelForState(state){
    return ssGetServeLabels()[state];
  }

  function ssFormatMatchBeganText(){
    if(!ssMatchStartTime) return 'Unknown';
    const dateStr = ssMatchStartTime.toLocaleDateString();
    const timeStr = ssMatchStartTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    return dateStr + ' ' + timeStr;
  }

  function ssFormatMatchLengthText(){
    if(!ssMatchStartTime || !ssMatchEndTime) return 'Unknown';
    const totalSeconds = Math.max(0, Math.round((ssMatchEndTime - ssMatchStartTime) / 1000));
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;
    return minutes + ' minutes ' + seconds + ' seconds';
  }

  function ssComputeMatchStats(){
    const stats = {
      1: { total: 0, goals: 0, fouls: 0, penalties: 0 },
      2: { total: 0, goals: 0, fouls: 0, penalties: 0 }
    };

    ssHistory.forEach(entry => {
      if(entry.type === 'score'){
        const p = entry.player;
        if(entry.amount === 2){ stats[p].goals += entry.amount; }
        else if(entry.amount === 1){ stats[p].fouls += entry.amount; }
        stats[p].total += entry.amount;
      } else if(entry.type === 'penalty'){
        const opponent = entry.player === 1 ? 2 : 1;
        stats[opponent].penalties += 2;
        stats[opponent].total += 2;
      }
    });

    return stats;
  }

  function ssBuildSetDetailsLines(){
    let runningScore1 = 0;
    let runningScore2 = 0;
    const lines = [];

    ssHistory.forEach(entry => {
      if(entry.type === 'score'){
        if(entry.player === 1){ runningScore1 += entry.amount; } else { runningScore2 += entry.amount; }
        if(entry.amount === 2){
          const scorerName = entry.player === 1 ? ssPlayer1Name : ssPlayer2Name;
          lines.push(ssServeLabelForState(entry.prevServe) + ' - ' + scorerName + ' Goal - ' + runningScore1 + '-' + runningScore2);
        } else {
          const committingName = entry.player === 1 ? ssPlayer2Name : ssPlayer1Name;
          lines.push(ssServeLabelForState(entry.prevServe) + ' - ' + committingName + ' Foul - ' + runningScore1 + '-' + runningScore2);
        }
      } else if(entry.type === 'penalty'){
        const opponent = entry.player === 1 ? 2 : 1;
        if(opponent === 1){ runningScore1 += 2; } else { runningScore2 += 2; }
        const committingName = entry.player === 1 ? ssPlayer1Name : ssPlayer2Name;
        lines.push(committingName + ' Penalty - ' + runningScore1 + '-' + runningScore2);
      } else if(entry.type === 'warning'){
        const name = entry.player === 1 ? ssPlayer1Name : ssPlayer2Name;
        lines.push(name + ' warning');
      } else if(entry.type === 'timeout'){
        const name = entry.player === 1 ? ssPlayer1Name : ssPlayer2Name;
        lines.push(name + ' time out');
      }
    });

    return lines;
  }

  function ssBuildMatchSummaryText(){
    const winnerName = ssWinner === 1 ? ssPlayer1Name : ssPlayer2Name;

    const lines = [];
    lines.push('Showdown Match Report');
    lines.push('======================');
    lines.push('');
    lines.push(ssPlayer1Name + ' vs ' + ssPlayer2Name);
    lines.push('Single set');
    lines.push('Winner: ' + winnerName + ' (' + ssScore1 + '-' + ssScore2 + ')');
    lines.push('Match began: ' + ssFormatMatchBeganText());
    lines.push('Match length: ' + ssFormatMatchLengthText());
    lines.push('');

    const stats = ssComputeMatchStats();
    lines.push('Player points');
    lines.push('-------------');
    lines.push(ssPlayer1Name + ' total points: ' + stats[1].total);
    lines.push(ssPlayer1Name + ' points from goals: ' + stats[1].goals);
    lines.push(ssPlayer1Name + ' points from fouls: ' + stats[1].fouls);
    lines.push(ssPlayer1Name + ' points from penalties: ' + stats[1].penalties);
    lines.push(ssPlayer2Name + ' total points: ' + stats[2].total);
    lines.push(ssPlayer2Name + ' points from goals: ' + stats[2].goals);
    lines.push(ssPlayer2Name + ' points from fouls: ' + stats[2].fouls);
    lines.push(ssPlayer2Name + ' points from penalties: ' + stats[2].penalties);

    lines.push('');
    lines.push('Set 1 Details');
    lines.push('-------------');
    ssBuildSetDetailsLines().forEach(line => { lines.push(line); });

    return lines.join('\n');
  }

  function ssDownloadMatchSummary(){
    const text = ssBuildMatchSummaryText();
    const blob = new Blob([text], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);

    const filename = 'match-result-' + sanitizeForFilename(ssPlayer1Name) + '-vs-' + sanitizeForFilename(ssPlayer2Name) + '.txt';

    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function ssAnnounceScores(){
    const won = ssCheckWin();
    if(won === 1){
      ssAnnounce(ssScore1 + '. ' + ssScore2 + '.');
    } else if(won === 2){
      ssAnnounce(ssScore2 + '. ' + ssScore1 + '.');
    } else if(ssServeState === 2 || ssServeState === 3){
      ssAnnounce(ssScore2 + '. ' + ssScore1 + '.');
    } else {
      ssAnnounce(ssScore1 + '. ' + ssScore2 + '.');
    }
  }

  function ssRenderScores(){
    ssScore1El.textContent = ssScore1;
    ssScore2El.textContent = ssScore2;
    ssScoreboardEl.setAttribute('aria-label', ssScore1 + '. ' + ssScore2 + '.');
  }

  function ssCurrentServeDisplayText(){
    if(ssWinner !== null){
      const winnerName = ssWinner === 1 ? ssPlayer1Name : ssPlayer2Name;
      return winnerName + ' wins the set: ' + ssScore1 + '-' + ssScore2;
    }
    return ssGetServeLabels()[ssServeState];
  }

  function ssRenderServe(){
    if(!ssTimeoutActive){
      ssServeStateEl.textContent = ssCurrentServeDisplayText();
      ssServeStateEl.classList.toggle('win', ssWinner !== null);
    }

    const servingPlayer = ssServeState < 2 ? 1 : 2;
    const filledCount = (ssServeState % 2 === 0) ? 1 : 2;

    [1,2].forEach(player => {
      ssDots[player].forEach((dot, i) => {
        const isServer = player === servingPlayer;
        dot.classList.toggle('filled', isServer && i < filledCount);
        dot.style.visibility = isServer ? 'visible' : 'hidden';
      });
    });
  }

  function ssUpdateUndoState(){
    ssUndoBtn.disabled = ssHistory.length === 0;
  }

  function ssCheckWin(){
    if(ssScore1 >= 11 && ssScore1 - ssScore2 >= 2) return 1;
    if(ssScore2 >= 11 && ssScore2 - ssScore1 >= 2) return 2;
    return null;
  }

  function ssSetActionButtonsDisabled(disabled){
    ssActionButtons.forEach(btn => { btn.disabled = disabled; });
  }

  function ssRefreshButtonStates(){
    const blocked = ssWinner !== null || ssTimeoutActive;
    ssSetActionButtonsDisabled(blocked);
    ssP1timeoutBtn.disabled = blocked || ssP1TimeoutUsed;
    ssP2timeoutBtn.disabled = blocked || ssP2TimeoutUsed;
  }

  function ssFinalizeGameWin(player){
    ssWinner = player;
    ssRefreshButtonStates();

    ssAfterSound(ssWinSound, () => {
      if(ssWinner !== player) return;

      ssMatchEndTime = new Date();
      const winnerName = player === 1 ? ssPlayer1Name : ssPlayer2Name;
      ssMatchWinBtn.textContent = winnerName + ' wins the set: ' + ssScore1 + '-' + ssScore2 + '. Press to download results.';
      ssShowServeBarMode('matchWin');
      setTimeout(() => { ssMatchWinBtn.focus(); }, 0);
    });
  }

  function ssClearGameWin(){
    ssShowServeBarMode('status');

    ssWinner = null;
    ssRefreshButtonStates();
    ssRenderServe();
  }

  function ssApplyWinCheck(){
    const won = ssCheckWin();
    if(won && ssWinner === null){
      ssFinalizeGameWin(won);
    } else if(!won && ssWinner !== null){
      ssClearGameWin();
    }
  }

  ssMatchWinBtn.addEventListener('click', () => {

  ssCountdownEl.addEventListener('click', () => {

  function ssShowServeBarMode(mode){
    ssServeStateEl.hidden = (mode !== 'status');
    ssCountdownEl.hidden = (mode !== 'countdown');
    ssMatchWinBtn.hidden = (mode !== 'matchWin');
  }

  function ssAddPoints(player, amount){
    if(ssWinner !== null) return;

    const prevServe = ssServeState;
    if(player === 1){ ssScore1 += amount; } else { ssScore2 += amount; }
    ssHistory.push({ type: 'score', player, amount, prevServe });
    ssServeState = (ssServeState + 1) % 4;
    ssPointsScoredSinceReset = true;

    ssRenderScores();
    ssRenderServe();

    const wonNow = ssCheckWin();
    if(!wonNow){ ssAnnounceScores(); }

    ssUpdateUndoState();
    ssApplyWinCheck();
  }

  function ssUpdateWarnIndicatorUI(player){
    const issued = player === 1 ? ssP1WarningIssued : ssP2WarningIssued;
    const btn = player === 1 ? ssP1WarnBtn : ssP2WarnBtn;
    btn.classList.toggle('active', issued);
    btn.setAttribute('aria-pressed', issued ? 'true' : 'false');
  }

  function ssToggleWarningIndicator(player){
    if(ssWinner !== null) return;

    if(player === 1){ ssP1WarningIssued = !ssP1WarningIssued; } else { ssP2WarningIssued = !ssP2WarningIssued; }
    ssHistory.push({ type: 'warning', player });
    ssUpdateWarnIndicatorUI(player);
    ssUpdateUndoState();
  }

  function ssHandlePenaltyPress(penalizingPlayer){
    if(ssWinner !== null) return;

    const opponent = penalizingPlayer === 1 ? 2 : 1;
    if(opponent === 1){ ssScore1 += 2; } else { ssScore2 += 2; }
    ssHistory.push({ type: 'penalty', player: penalizingPlayer, prevServe: ssServeState });
    ssPointsScoredSinceReset = true;

    const wonNow = ssCheckWin();

    ssRenderScores();
    if(!wonNow){ ssAnnounceScores(); }
    ssUpdateUndoState();
    ssApplyWinCheck();
  }

  ssP2PenaltyBtn.addEventListener('click', () => ssHandlePenaltyPress(2));

  function ssStartTimeout(player){
    if(ssWinner !== null || ssTimeoutActive) return;
    const used = player === 1 ? ssP1TimeoutUsed : ssP2TimeoutUsed;
    if(used) return;

    if(player === 1){ ssP1TimeoutUsed = true; } else { ssP2TimeoutUsed = true; }
    ssTimeoutActive = true;
    ssHistory.push({ type: 'timeout', player });
    ssUpdateUndoState();
    ssRefreshButtonStates();

    const name = player === 1 ? ssPlayer1Name : ssPlayer2Name;

    ssServeStateEl.classList.remove('win');
    ssShowServeBarMode('countdown');

    ssCountdownEl.textContent = '';
    ssAnnounce('60 seconds started');

    setTimeout(() => {
      ssCountdownEl.focus();

      setTimeout(() => {
        let remaining = 60;
        ssCountdownEl.textContent = name + ' Time Out: ' + remaining;

        function finishTimeoutCountdown(){
          clearInterval(ssTimeoutIntervalId);
          ssTimeoutIntervalId = null;
          ssTimeoutActive = false;
          ssActiveCountdownFinisher = null;
          ssRefreshButtonStates();

          ssAnnounce('Time out over');

          setTimeout(() => {
            ssShowServeBarMode('status');
            ssServeStateEl.textContent = '';

            setTimeout(() => {
              ssRenderServe();
              setTimeout(() => { ssAnnounceScores(); }, 500);
            }, 60);
          }, 500);
        }

        ssActiveCountdownFinisher = finishTimeoutCountdown;

        ssTimeoutIntervalId = setInterval(() => {
          remaining--;

          if(remaining > 15){
            ssCountdownEl.textContent = name + ' Time Out: ' + remaining;
          } else if(remaining > 0){
            const text = remaining + ' seconds';
            ssCountdownEl.textContent = text;
            if(remaining === 15){ ssAnnounce(text); }
          }

          if(remaining <= 0){
            finishTimeoutCountdown();
          }
        }, 1000);
      }, 60);
    }, 0);
  }

  ssP1timeoutBtn.addEventListener('click', () => ssStartTimeout(1));
  ssP2timeoutBtn.addEventListener('click', () => ssStartTimeout(2));

  ssUndoBtn.addEventListener('click', () => {
    if(ssHistory.length === 0) return;
    const last = ssHistory.pop();

    if(last.type === 'score'){
      if(last.player === 1){ ssScore1 -= last.amount; } else { ssScore2 -= last.amount; }
      ssServeState = last.prevServe;

      ssRefreshButtonStates();
      ssRenderScores();
      ssRenderServe();
      ssAnnounceScores();
      ssUpdateUndoState();
      ssUpdateWarnIndicatorUI(1);
      ssUpdateWarnIndicatorUI(2);
      ssApplyWinCheck();

    } else if(last.type === 'warning'){
      if(last.player === 1){ ssP1WarningIssued = false; } else { ssP2WarningIssued = false; }
      ssRefreshButtonStates();
      ssRenderScores();
      ssRenderServe();
      ssUpdateWarnIndicatorUI(last.player);
      ssUpdateUndoState();

    } else if(last.type === 'penalty'){
      const opponent = last.player === 1 ? 2 : 1;
      if(opponent === 1){ ssScore1 -= 2; } else { ssScore2 -= 2; }

      ssRefreshButtonStates();
      ssRenderScores();
      ssRenderServe();
      ssAnnounceScores();
      ssUpdateWarnIndicatorUI(1);
      ssUpdateWarnIndicatorUI(2);
      ssUpdateUndoState();
      ssApplyWinCheck();

    } else if(last.type === 'timeout'){
      if(ssTimeoutActive && ssTimeoutIntervalId !== null){
        clearInterval(ssTimeoutIntervalId);
        ssTimeoutIntervalId = null;
        ssTimeoutActive = false;
        ssActiveCountdownFinisher = null;
        ssShowServeBarMode('status');
      }

      if(last.player === 1){ ssP1TimeoutUsed = false; } else { ssP2TimeoutUsed = false; }

      ssRefreshButtonStates();
      ssRenderScores();
      ssRenderServe();
      ssUpdateUndoState();
    }
  });

  document.getElementById('resetBtnSs').addEventListener('click', () => {
    if(ssTimeoutIntervalId){ clearInterval(ssTimeoutIntervalId); ssTimeoutIntervalId = null; }
    ssActiveCountdownFinisher = null;
    ssTimeoutActive = false;
    ssP1TimeoutUsed = false;
    ssP2TimeoutUsed = false;

    ssScore1 = 0;
    ssScore2 = 0;
    ssServeState = 0;
    ssHistory = [];
    ssWinner = null;
    ssP1WarningIssued = false;
    ssP2WarningIssued = false;
    ssShowServeBarMode('status');

    ssMatchStartTime = new Date();
    ssMatchEndTime = null;
    ssPointsScoredSinceReset = false;

    ssRefreshButtonStates();
    ssRenderScores();
    ssRenderServe();
    ssUpdateUndoState();
    ssUpdateWarnIndicatorUI(1);
    ssUpdateWarnIndicatorUI(2);
    ssAnnounce('Reset. ' + ssGetServeLabels()[ssServeState] + '. 0. 0.');
  });

  ssBackToNamesBtn.addEventListener('click', () => {
    ssBackToNamesBtn.blur();

    if(ssTimeoutIntervalId){ clearInterval(ssTimeoutIntervalId); ssTimeoutIntervalId = null; }
    ssActiveCountdownFinisher = null;
    ssTimeoutActive = false;
    ssShowServeBarMode('status');

    p1LandingNameInput.value = ssPlayer1Name;
    p2LandingNameInput.value = ssPlayer2Name;
    updateSwapButtonState();

    selectedMode = 'singleSet';
    updateModeButtons();

    singleSetScoreboardPage.hidden = true;
    landingPage.hidden = false;
  });

  ssRenderScores();
  ssRenderServe();
  ssUpdateUndoState();
  ssUpdateWarnIndicatorUI(1);
  ssUpdateWarnIndicatorUI(2);
  ssRefreshButtonStates();

  setTimeout(() => {
    document.getElementById('appTitle').focus();
  }, 0);
</script>

</body>
</html>
